# One application instance and one persistent SQLite data directory.
# Terminate HTTPS with Nginx on the EC2 host (see deploy/nginx.ec2.conf).
services:
  rms:
    build: .
    restart: unless-stopped
    init: true
    environment:
      RMS_ENV: production
      RMS_SECRET_KEY: ${RMS_SECRET_KEY:?Copy .env.example to .env and set RMS_SECRET_KEY}
      RMS_SETUP_TOKEN: ${RMS_SETUP_TOKEN:-}
      RMS_SMTP_PASSWORD: ${RMS_SMTP_PASSWORD:-}
      RMS_SFTP_PRIVATE_KEY: ${RMS_SFTP_PRIVATE_KEY:-}
      RMS_TWILIO_AUTH_TOKEN: ${RMS_TWILIO_AUTH_TOKEN:-}
      RMS_SENDGRID_API_KEY: ${RMS_SENDGRID_API_KEY:-}
      RMS_DOORDASH_API_KEY: ${RMS_DOORDASH_API_KEY:-}
      RMS_UBEREATS_API_KEY: ${RMS_UBEREATS_API_KEY:-}
    volumes:
      - ${RMS_DATA_DIR:-./data}:/data
    # Keep the application private; the host Nginx proxy is the public entrypoint.
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
