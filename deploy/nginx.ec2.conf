# Install as /etc/nginx/sites-available/rms after replacing rms.example.com.
# Obtain certificates with Certbot, then enable the HTTPS server below.
upstream rms_application {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name rms.example.com;
    client_max_body_size 10m;

    # Certbot can manage the HTTP-to-HTTPS redirect after issuance.
    location / {
        proxy_pass http://rms_application;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 65s;
    }
}

